[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raytracer"
version = "0.3.0"
description = "Optical ray-tracing toolkit: vectorized sequential 3-D propagation with prescription import and analysis, plus a branching 2-D propagation with OpenGL/matplotlib visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# vispy alone has no windowed backend: without one of these, it silently
# falls back to the offscreen "_egl" backend and .run() never shows a window.
gl = ["vispy>=0.14", "pyside6>=6.5"]
dev = ["pytest>=8", "vispy>=0.14", "pyside6>=6.5"]

[tool.setuptools.packages.find]
include = ["raytracer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests requiring an OpenGL context (deselect with '-m \"not gpu\"')",
    "slow: long-running full-system regressions",
]
