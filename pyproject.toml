[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raytracer"
version = "0.2.0"
description = "Optical ray-tracing toolkit: sequential 3-D engine with prescription import and analysis, plus a non-sequential 2-D engine with OpenGL/matplotlib visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gl = ["vispy>=0.14"]
dev = ["pytest>=8", "vispy>=0.14"]

[tool.setuptools.packages.find]
include = ["raytracer*"]

[tool.setuptools.package-data]
raytracer = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests requiring an OpenGL context (deselect with '-m \"not gpu\"')",
    "slow: long-running full-system regressions",
]
